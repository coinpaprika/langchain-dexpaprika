# Publishes to PyPI via trusted publishing (OIDC, no tokens).
#
# The PyPI pending publisher for langchain-dexpaprika is bound to exactly:
#   repository:  coinpaprika/langchain-dexpaprika
#   workflow:    release.yml
#   environment: pypi
# Do not rename this file or the environment; either change breaks the binding.
#
# The `pypi` environment must carry required-reviewer protection in the repo
# settings so a workflow_dispatch cannot publish without a second approval.
#
# Release flow: merge to main, create a GitHub release with tag vX.Y.Z,
# this workflow runs checks, builds with uv, and publishes dist/ to PyPI.
# Actions are pinned to full commit SHAs (mutable tags are a supply-chain risk
# for a job that holds id-token: write).

name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra test
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src/
      - name: Unit tests (sockets blocked)
        run: uv run pytest --disable-socket --allow-unix-socket tests/unit_tests/

  publish:
    runs-on: ubuntu-latest
    needs: [checks]
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
